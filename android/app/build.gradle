plugins { id 'com.android.application'; id 'com.chaquo.python' }
def metadata = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
android {
    namespace 'com.tiantianxiangshang.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.tiantianxiangshang.app'
        minSdk 26
        targetSdk 36
        versionCode(metadata.android.versionCode as int)
        versionName metadata.version
        resValue 'string', 'app_name', metadata.android.displayName
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile rootProject.file('../.cache/android-debug.keystore') } }
    // Go already strips symbols; package the library without an additional NDK strip step.
    packaging { jniLibs { useLegacyPackaging = false; keepDebugSymbols += ['**/libtiantian.so'] } }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        def taskPython = System.getenv('TIANTIAN_PYTHON')
        if (!taskPython && System.getenv('LOCALAPPDATA')) {
            def installedPython = new File(System.getenv('LOCALAPPDATA'), 'Programs/Python/Python312/python.exe')
            if (installedPython.isFile()) taskPython = installedPython.absolutePath
        }
        buildPython(taskPython ?: 'python')
        pip {
            install "requests==2.32.5"
            install "beautifulsoup4==4.14.2"
            install "loguru==0.7.3"
            install "tqdm==4.67.1"
            install "httpx==0.28.1"
            install "fonttools==4.60.1"
        }
    }
}
